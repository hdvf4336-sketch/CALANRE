<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap');

/* =========================
   GLOBAL DESIGN SYSTEM
========================= */

:root {
    --bg: #08090c;
    --surface: #111318;
    --gold: #d6b779;
    --gold-light: #f2d9a0;
    --white: #f5f3ed;
    --muted: #777d88;
    --border: rgba(214, 183, 121, 0.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 35px;

    padding: 20px;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(214, 183, 121, 0.09),
            transparent 35%
        ),
        linear-gradient(135deg, #08090c, #101116 55%, #08090c);

    font-family: 'Outfit', sans-serif;
    color: var(--white);

    overflow: hidden;
}

/* =========================
   DATE
========================= */

#div1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    padding: 13px 30px;

    background: rgba(255, 255, 255, 0.025);

    border: 1px solid var(--border);
    border-radius: 50px;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px rgba(255, 255, 255, 0.04);

    backdrop-filter: blur(15px);

    animation: fadeDown 1s ease both;
}

#div1 p {
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(11px, 2vw, 15px);
    font-weight: 500;

    letter-spacing: 2px;
}

/* =========================
   CLOCK FRAME
========================= */

#div2 {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;

    padding: 48px 55px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.045),
            rgba(255, 255, 255, 0.008)
        ),
        #111318;

    border: 1px solid rgba(214, 183, 121, 0.24);
    border-radius: 28px;

    box-shadow:
        0 35px 90px rgba(0, 0, 0, 0.65),
        0 0 60px rgba(214, 183, 121, 0.035),
        inset 0 1px rgba(255, 255, 255, 0.07);

    animation: fadeUp 1s ease both;

    transition:
        transform 0.5s ease,
        border-color 0.5s ease,
        box-shadow 0.5s ease;
}

/* Decorative top line */

#div2::before {
    content: "";

    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );

    opacity: 0.7;
}

/* =========================
   TIME NUMBERS
========================= */

#div2 h1 {
    min-width: 100px;

    font-family: 'Orbitron', sans-serif;
    font-size: clamp(45px, 8vw, 90px);
    font-weight: 500;

    text-align: center;
    font-variant-numeric: tabular-nums;

    color: var(--white);

    text-shadow:
        0 0 25px rgba(242, 217, 160, 0.12);

    transition: color 0.3s ease;
}

/* =========================
   SEPARATORS
========================= */

#n1,
#n2 {
    min-width: 12px !important;

    color: var(--gold) !important;

    font-weight: 300 !important;

    animation: separator 1s infinite;
}

/* Seconds highlight */

#se {
    color: var(--gold-light) !important;

    text-shadow:
        0 0 15px rgba(242, 217, 160, 0.3),
        0 0 35px rgba(214, 183, 121, 0.12);
}

/* =========================
   HOVER INTERACTION
========================= */

#div2:hover {
    transform: translateY(-6px);

    border-color: rgba(214, 183, 121, 0.55);

    box-shadow:
        0 45px 100px rgba(0, 0, 0, 0.75),
        0 0 60px rgba(214, 183, 121, 0.08),
        inset 0 1px rgba(255, 255, 255, 0.08);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes separator {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.2;
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width: 600px) {

    body {
        gap: 25px;
        padding: 12px;
    }

    #div2 {
        width: 100%;
        max-width: 420px;

        gap: 3px;
        padding: 30px 10px;

        border-radius: 20px;
    }

    #div2 h1 {
        min-width: 0;
        flex: 1;
        font-size: clamp(28px, 9vw, 48px);
    }

    #n1,
    #n2 {
        flex: 0 0 10px;
        min-width: 10px !important;
    }

    #div1 {
        gap: 8px;
        padding: 12px 16px;
    }

    #div1 p {
        font-size: 11px;
        letter-spacing: 1px;
    }
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 350px) {

    #div2 {
        padding: 25px 6px;
    }

    #div2 h1 {
        font-size: 26px;
    }

    #n1,
    #n2 {
        flex-basis: 7px;
        min-width: 7px !important;
    }
}

/* =========================
   ACCESSIBILITY
========================= */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

    </style>
</head>
<body>
    <div id="div1">
        <p id="ans"></p>
        <p>-</p>
        <p id="mo"></p>
        <p>-</p>
        <p id="d"></p>
    </div>
    <div id="div2">
        &nbsp;<h1 id="he"></h1>&nbsp;
        &nbsp;<h1 id="n1" >:</h1>&nbsp;
        &nbsp;&nbsp;<h1 id="me"></h1>&nbsp;&nbsp;
        &nbsp;<h1 id="n2"></h1>&nbsp;
        &nbsp;<h1 id="se"></h1>&nbsp;
    </div>
</body>
<script>
    document.body.onload=function(){
        let d = new Date();
        let ans = d.getFullYear();
        let Month = d.getMonth();
        let Day = d.getDate()
        document.getElementById('ans').innerText=ans;
        document.getElementById('mo').innerText=Month +1;
        document.getElementById('d').innerText=Day;
        let h = d.getHours();
        let m = d.getMinutes();
        let s = d.getSeconds();
        if(h<10){
           document.getElementById('he').innerText="0"+h;
        }
        else{
            document.getElementById('he').innerText=h;
        }
        if(m<10){
           document.getElementById('me').innerText="0"+m;
        }
        else{
            document.getElementById('me').innerText=m;
        }
        if(s<10){
           document.getElementById('se').innerText="0"+s;
        }
        else{
            document.getElementById('se').innerText=s;
        }
        
    }

    function addsecone(){
        s=document.getElementById('se').innerText;
        m=document.getElementById('me').innerText;
        h=document.getElementById('he').innerText;
        s=parseInt(s)
        m=parseInt(m)
        h=parseInt(h)
        if(s<59){
            if(s<9){
                s=s+1
                document.getElementById('se').innerText="0"+s;
            }
            else{
                document.getElementById('se').innerText=s+1;
            }  
        }
        else if(s==59 && m<59){
            if(m<9){
                m=m+1
                document.getElementById('me').innerText="0"+m;
            }
            else{
                document.getElementById('me').innerText=m+1;
            }  
            document.getElementById('se').innerText='00';

        }
        else if(s==59 && m==59 && h<23){
            document.getElementById('me').innerText='00';
            document.getElementById('se').innerText='00';
            if(h<9){
                h=h+1
                document.getElementById('he').innerText="0"+h;
            }
            else{
                document.getElementById('he').innerText=h+1;
            }  
            

        }
        else{
            document.getElementById('me').innerText='00';
            document.getElementById('se').innerText='00';
            document.getElementById('he').innerText='00';
            let d = new Date();
            let ans = d.getFullYear();
            let Month = d.getMonth();
            let Day = d.getDate()
            document.getElementById('ans').innerText=ans;
            document.getElementById('mo').innerText=Month +1;
            document.getElementById('d').innerText=Day;
        }


    }
    function no9ate(){
        a=document.getElementById('n1').innerText
        b=document.getElementById('n2').innerText
        if(a==":"){
            document.getElementById('n1').innerText=""
            document.getElementById('n2').innerText=":"
        }
        else{
            document.getElementById('n1').innerText=":"
            document.getElementById('n2').innerText=""
        }
    }
    setInterval(addsecone,1000)
    setInterval(no9ate,1000)

</script>
</html>
